# Checks that the project template in this repo stays healthy:
# host tests pass, firmware compiles, Python tools and prompt templates are valid, and the template's
# copy of the board reference matches hardware/boards/.
name: template

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Board reference copy is in sync
        run: diff -u ../hardware/boards/guition-jc4827w543.md docs/hardware/guition-jc4827w543.md

      - name: Python tools compile
        run: python3 -m py_compile tools/esp_serial.py tools/trace.py test/bench/*.py ../bench/bench-ble-scan

      - name: Tool tests (serial tool parsing, traceability)
        run: |
          python3 -m pip install --quiet pytest pyserial
          python3 -m pytest -q ../tests

      - name: Shell scripts parse
        run: for f in ../devbox/*.sh ../tools/*.sh ../bench/bench-wifi ../bench/bench-mqtt; do bash -n "$f"; done

      - name: Prompt templates have frontmatter with a description
        run: |
          for f in ../prompts/*.md; do
            head -1 "$f" | grep -qx -- '---' && grep -q '^description: ' "$f" || { echo "bad frontmatter: $f"; exit 1; }
          done

      # The short loop only works while the files every session loads stay small.
      - name: Always-loaded files stay within their budgets
        run: |
          check() { n=$(wc -l < "$1"); echo "$1: $n lines (max $2)"; [ "$n" -le "$2" ]; }
          check AGENTS.md 120
          check PROGRESS.md 60
          check ../generic/AGENTS.md 80
          check ../generic/PROGRESS.md 60
          check ../user-level/AGENTS.md 50
          for f in CLAUDE.md ../generic/CLAUDE.md; do
            [ "$(cat "$f")" = "@AGENTS.md" ] || { echo "$f must contain only @AGENTS.md"; exit 1; }
          done

      - name: No references to retired commands or files
        run: |
          if grep -rn -e '/build-loop' -e '/wrap-up' -e 'NOTES\.md' \
              ../prompts ../generic ../profiles ../user-level AGENTS.md PROGRESS.md README.md docs \
              ../README.md ../docs/GUIDE.md ../docs/SHORT-LOOP.md ../docs/cheatsheet.md \
              ../docs/testing.md ../docs/troubleshooting.md ../docs/planning-chat.md; then
            echo "retired names are still referenced (see above)"; exit 1
          fi

      - name: Host tests (tier 1)
        run: make host-test

      - name: Every template requirement points at a real test
        run: python3 tools/trace.py --strict --out "$GITHUB_STEP_SUMMARY"

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino core + libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ hashFiles('template/Makefile') }}

      - name: Install ESP32 core + libraries
        run: make deps

      - name: Compile firmware
        run: make compile

      - name: Firmware size
        run: ls -l build/fw/*.bin
